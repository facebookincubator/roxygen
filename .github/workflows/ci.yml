name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Commands run without --locked because the checked-in Cargo.lock may need its
# crates.io checksums refreshed.
# The pinned Rust version tracks the toolchain the project is developed against.

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.98.1"
          components: clippy
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace --no-fail-fast
      - run: cargo test --workspace --no-fail-fast --features ferroxygen_server/http3
      - run: cargo clippy --workspace --all-targets
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  observability:
    name: Linux (observability)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.98.1"
          components: clippy
      - run: cargo test --workspace --no-fail-fast --features ferroxygen_runtime/observability
      - run: cargo clippy --workspace --all-targets --all-features

  ring:
    name: Linux (ring)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.98.1"
          components: clippy
      - run: cargo test --workspace --no-fail-fast --no-default-features --features ring,ferroxygen_server/http3
      - run: cargo clippy --workspace --all-targets --no-default-features --features ring,ferroxygen_server/http3
      - name: Check that aws-lc-rs is not built
        run: |
          if cargo tree --workspace --no-default-features --features ring,ferroxygen_server/http3 -e all --prefix none | grep -E '^aws-lc-(rs|sys) '; then
            echo "the ring build depends on aws-lc-rs" >&2
            exit 1
          fi

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.98.1"
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace --no-fail-fast

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.95"
      - run: cargo build --workspace --lib --bins
