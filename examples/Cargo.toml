# @generated by autocargo from //roxygen/examples:[axum_router,client_get,hello_server,owned_client,owned_server,streaming_server,tls_server]

[package]
name = "ferroxygen_examples"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Example programs for Roxygen"
readme = "../README.md"
repository = "https://github.com/facebookincubator/roxygen"
license = "MIT"
keywords = ["client", "http", "http2", "proxygen", "server"]
categories = ["network-programming", "web-programming::http-client", "web-programming::http-server"]
publish = false

[package.metadata]

[package.metadata.docs]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]

[[bin]]
name = "axum_router"
path = "axum_router.rs"

[[bin]]
name = "client_get"
path = "client_get.rs"

[[bin]]
name = "hello_server"
path = "hello_server.rs"

[[bin]]
name = "owned_client"
path = "owned_client.rs"

[[bin]]
name = "owned_server"
path = "owned_server.rs"

[[bin]]
name = "streaming_server"
path = "streaming_server.rs"

[[bin]]
name = "tls_server"
path = "tls_server.rs"

[dependencies]
axum = "0.8.9"
ferroxygen_client = { version = "0.1.0", path = "../client", default-features = false }
ferroxygen_core = { version = "0.1.0", path = "../core" }
ferroxygen_hyper_adapter = { version = "0.1.0", path = "../adapters/hyper" }
ferroxygen_runtime = { version = "0.1.0", path = "../runtime" }
ferroxygen_server = { version = "0.1.0", path = "../server", default-features = false }
ferroxygen_tower_adapter = { version = "0.1.0", path = "../adapters/tower", default-features = false }
ferroxygen_transport = { version = "0.1.0", path = "../transport", default-features = false }
rcgen = "0.14.10"
tokio = { version = "1.54.1", features = ["macros", "net", "rt", "signal", "time"] }

[features]
aws-lc-rs = ["ferroxygen_client/aws-lc-rs", "ferroxygen_server/aws-lc-rs", "ferroxygen_tower_adapter/aws-lc-rs", "ferroxygen_transport/aws-lc-rs"]
default = ["aws-lc-rs"]
ring = ["ferroxygen_client/ring", "ferroxygen_server/ring", "ferroxygen_tower_adapter/ring", "ferroxygen_transport/ring"]

[lints]
workspace = true
